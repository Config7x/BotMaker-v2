# maxmemory-policy trade-offs for this deployment:
#   allkeys-lru   (current) - evicts the least-recently-used key of ANY kind
#                 under memory pressure, including short-lived lock keys
#                 (faoxima:cronlock:*) and dedupe keys (faoxima:dedupe:*).
#                 The application already tolerates early eviction of these
#                 keys safely (file-lock fallback, MySQL dedupe fallback),
#                 so this is acceptable but not ideal under sustained load.
#   volatile-lru  - only evicts keys that have a TTL set; since every key
#                 this project writes already carries a TTL, behavior is
#                 nearly identical to allkeys-lru here, with no real safety
#                 gain — not worth the switch on its own.
#   noeviction    - Redis returns an OOM error instead of evicting anything
#                 once maxmemory is reached. Safest for lock/dedupe
#                 correctness (nothing disappears early), but write
#                 operations (including cache writes) start failing outright
#                 when full instead of degrading gracefully; the app's
#                 existing try/catch fallback still applies, so failures
#                 fall back to MySQL/file locking rather than crashing.
# Changing this value is an operational decision, not something the
# application changes at runtime — pick the policy that matches your
# traffic pattern and available memory headroom.
maxmemory 64mb
maxmemory-policy allkeys-lru
save ""
appendonly no
